AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - 'lib/generators/**/*'
    - 'tmp/**/*'
    - 'spec/**/*'
    - 'vendor/**/*' # added by github actions
    # Bundled Agent Skill scripts are single-file programs run standalone (e.g. via `rails runner`)
    # inside a user's app, so the gem's own style rules don't apply to them.
    - 'skills/blueprinter-v2-upgrade/scripts/**/*'

Style/Documentation:
  Enabled: false

Style/SafeNavigation:
  Enabled: false

Layout/FirstArrayElementIndentation:
  Enabled: false

Layout/LineLength:
  Max: 125

Lint/HashCompareByIdentity:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

Metrics/ClassLength:
  Max: 120

Metrics/ModuleLength:
  Max: 120

Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Exclude:
    - 'lib/blueprinter/view_collection.rb'

Metrics/AbcSize:
  Enabled: false

Metrics/ParameterLists:
  Max: 10

Naming/MemoizedInstanceVariableName:
  EnforcedStyleForLeadingUnderscores: required
