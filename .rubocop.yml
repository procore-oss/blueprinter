AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - 'lib/generators/**/*'
    - 'tmp/**/*'
    - 'spec/**/*'
    - 'vendor/**/*' # added by github actions

Style/Documentation:
  Enabled: false

Style/SafeNavigation:
  Enabled: false

Layout/FirstArrayElementIndentation:
  Enabled: false

Layout/LineLength:
  Max: 125

Lint/HashCompareByIdentity:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

Metrics/ClassLength:
  Max: 120
  # Bundled Agent Skill scripts are single-file programs run standalone (e.g. via `rails runner`)
  # inside a user's app. Splitting them across files to satisfy a size cop would break that.
  Exclude:
    - 'skills/**/*'

Metrics/ModuleLength:
  Max: 120
  Exclude:
    - 'skills/**/*'

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Enabled: false

Metrics/ParameterLists:
  Max: 10

Naming/MemoizedInstanceVariableName:
  EnforcedStyleForLeadingUnderscores: required
